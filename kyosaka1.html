        #voucher-modal { display: none; flex-direction: column; }

        @keyframes fadeInModal { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(4px); } }

</head>

<body class="flex justify-center items-center h-[100dvh] overflow-hidden relative bg-red-500">

    <!-- 網頁底層背景：達摩圖案 (透明度10%，搭配柔和紅底色) -->
    <svg class="fixed inset-0 w-full h-full object-cover opacity-10 pointer-events-none z-[-1]" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="bg-daruma-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M40 15 C 60 15, 65 35, 65 55 C 65 75, 50 75, 40 75 C 30 75, 15 75, 15 55 C 15 35, 20 15, 40 15 Z" fill="#fff" stroke="#450a0a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="40" cy="45" rx="16" ry="14" fill="#ffe4e6" stroke="#450a0a" stroke-width="1.5"/>
            <circle cx="34" cy="43" r="2.5" fill="#450a0a"/>
            <circle cx="46" cy="43" r="2.5" fill="#450a0a"/>
            <path d="M29 38 Q 34 35 37 39 M43 39 Q 46 35 51 38" stroke="#450a0a" fill="none" stroke-width="2" stroke-linecap="round"/>
            <path d="M35 52 Q 40 55 45 52" stroke="#450a0a" fill="none" stroke-width="2" stroke-linecap="round"/>
            <path d="M30 62 Q 40 70 50 62" stroke="#450a0a" fill="none" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M35 66 L 45 66" stroke="#450a0a" fill="none" stroke-width="1.5" stroke-linecap="round"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="100%" height="100%" fill="url(#bg-daruma-pattern)" />
    </svg>

    <!-- App 框架容器 -->
    <div class="w-full h-[100dvh] max-h-[100dvh] max-w-[420px] bg-white flex flex-col relative shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] overflow-hidden sm:rounded-[2.5rem] border-[2px] sm:border-[3px] border-white/60 mx-auto">

        <!-- 憑證彈窗 Modal -->
        <div id="voucher-modal" class="absolute inset-0 z-[60] items-center justify-center p-5 bg-slate-900/80">
            <button onclick="closeVoucher()" class="absolute top-5 right-5 p-2.5 bg-white/20 hover:bg-white/30 rounded-full text-white backdrop-blur-md transition-colors z-50 shadow-lg">
                <i class="ph-bold ph-x text-lg"></i>
            </button>
            <div id="voucher-content" class="w-full max-w-sm max-h-[85%] flex flex-col justify-center items-center"></div>
        </div>

        <!-- 頂部 Header -->
        <header class="relative px-5 pt-8 pb-5 shadow-sm z-10 overflow-hidden bg-red-600 shrink-0 border-b border-red-700/50">
            <svg class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="100%" height="100%" fill="url(#bg-daruma-pattern)" />
            </svg>
            <div class="relative z-10">
                <h1 class="text-2xl font-black text-white tracking-wide drop-shadow-md">京阪雙城深度旅遊記</h1>
                <p class="text-sm text-red-100 mt-0.5 drop-shadow-sm font-medium">關西 6天5夜 黃金動線與預算</p>
            </div>
        </header>

        <!-- 主要內容區：純白底色保證閱讀清晰 -->
        <main class="flex-1 overflow-y-auto overflow-x-hidden pb-24 relative bg-white">

            <!-- Tab 1: 每日行程 -->
            <div id="tab-itinerary" class="tab-content active">
                <div id="day-selector" class="flex gap-1.5 px-3 py-3 bg-white/95 backdrop-blur-md sticky top-0 z-40 shadow-sm border-b border-slate-100 overflow-x-auto no-scrollbar"></div>
                <div id="itinerary-list" class="p-4 space-y-4"></div>
            </div>

            <!-- Tab 2: 預算記帳 -->
            <div id="tab-budget" class="tab-content">
                <div class="p-4 space-y-6">
                    <!-- 總預算面板 -->
                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden border border-slate-700">
                        <div class="absolute -right-2 -top-2 opacity-10"><i class="ph-fill ph-calculator text-9xl"></i></div>
                        <p class="text-slate-300 text-sm font-medium mb-1">總花費累計 (4人)</p>
                        <h2 class="text-4xl font-black tracking-tight" id="grand-total-display">NT$ 0</h2>
                        <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between items-center">
                            <span class="text-slate-300 text-xs">單人平均</span>
                            <span class="text-xl font-bold text-emerald-400" id="per-person-display">NT$ 0</span>
                        </div>
                    </div>

                    <!-- 固定支出 (可折疊) -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-800 mb-3 ml-1 flex items-center gap-1"><i class="ph-fill ph-lock-key text-slate-500"></i> 已知固定支出 (點擊可收折)</h3>
                        <div class="bg-slate-50 rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div id="fixed-budget-list"></div>
                            <div class="p-3 bg-slate-100/50 text-right border-t border-slate-200">
                                <span class="text-xs text-slate-500 font-bold" id="fixed-subtotal-display">小計：NT$ 0</span>
                            </div>
                        </div>
                    </div>

                    <!-- 即時記帳 -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-800 mb-3 ml-1 flex items-center gap-1">
                            <i class="ph-fill ph-coins text-amber-500"></i> 即時匯率與旅途記帳
                        </h3>
                        <div class="bg-slate-50 rounded-2xl shadow-sm border border-slate-200 p-4 mb-4">
                            <div class="flex items-center gap-2 mb-3 border-b border-slate-200 pb-3">
                                <div class="flex-1">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">日幣 (JPY)</label>
                                    <div class="flex items-center gap-1 mt-1">
                                        <span class="text-slate-400 font-bold text-lg">¥</span>
                                        <input type="number" id="jpy-input" class="w-full bg-white text-base font-bold text-slate-800 rounded-lg px-2 py-1.5 border border-slate-300 focus:outline-none focus:border-red-500 transition-colors" placeholder="輸入金額">
                                    </div>
                                </div>
                                <i class="ph-bold ph-arrows-left-right text-slate-300 mt-5"></i>
                                <div class="w-20 shrink-0">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">匯率</label>
                                    <input type="number" id="rate-input" step="0.001" value="0.21" class="w-full bg-white text-base font-bold text-slate-800 rounded-lg px-2 py-1.5 border border-slate-300 focus:outline-none focus:border-red-500 transition-colors mt-1 text-center">
                                </div>
                            </div>

                            <form id="expense-form" class="flex gap-2 items-end">
                                <div class="flex-1">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">消費項目</label>
                                    <input type="text" id="expense-name" placeholder="如: 晚餐/藥妝" required class="w-full bg-white text-sm font-medium rounded-lg px-3 py-2 border border-slate-300 focus:outline-none focus:border-red-500 transition-colors mt-1">
                                </div>
                                <div class="w-24 shrink-0">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">台幣 (TWD)</label>
                                    <input type="number" id="expense-amount" placeholder="自動換算" required class="w-full bg-red-50 text-sm font-bold text-red-600 rounded-lg px-3 py-2 border border-red-200 focus:outline-none focus:border-red-500 transition-colors mt-1">
                                </div>
                                <button type="submit" class="bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700 active:scale-95 transition-all shrink-0 h-[38px] shadow-sm">
                                    <i class="ph-bold ph-plus text-lg"></i>
                                </button>
                            </form>
                        </div>

                        <div class="bg-slate-50 rounded-2xl shadow-sm border border-slate-200 overflow-hidden min-h-[100px]">
                            <div id="dynamic-expense-list"></div>
                            <div class="p-3 bg-red-50/80 text-right border-t border-red-100/50">
                                <span class="text-xs text-red-600 font-black tracking-wide" id="dynamic-subtotal-display">動態小計：NT$ 0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab 3: 專屬地圖 (直接連結 Google Maps) -->
            <div id="tab-maps" class="tab-content h-full">
                <div class="p-5 flex flex-col h-full pb-20 overflow-y-auto space-y-6">
                    
                    <!-- 1. 當地即時天氣預報 -->
                    <div>
                        <div class="flex items-center justify-between mb-3 ml-1">
                            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1">
                                <i class="ph-fill ph-cloud-sun text-sky-500 text-lg"></i> 當地即時天氣預報
                            </h3>
                            <button onclick="fetchWeather()" class="text-xs text-slate-400 flex items-center gap-1 hover:text-slate-600 transition-colors">
                                <i class="ph-bold ph-arrows-clockwise"></i> 重新整理
                            </button>
                        </div>
                        
                        <!-- 京都與大阪 總覽 -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 grid grid-cols-2 gap-4 mb-4">
                            <!-- 京都天氣 -->
                            <div class="flex flex-col items-center justify-center p-3 bg-sky-50/50 rounded-xl border border-slate-100 relative">
                                <span class="text-[10px] font-bold text-slate-400 absolute top-2 left-2 uppercase tracking-wider">Kyoto</span>
                                <div id="kyoto-icon" class="text-4xl text-sky-400 mb-1 mt-2">
                                    <i class="ph ph-spinner animate-spin"></i>
                                </div>
                                <h4 class="text-sm font-black text-slate-700 mt-1">京都府</h4>
                                <div class="flex items-end gap-1 mt-1">
                                    <span id="kyoto-temp" class="text-2xl font-black text-slate-800 tracking-tighter">--</span>
                                    <span class="text-sm font-bold text-slate-500 mb-0.5">°C</span>
                                </div>
                            </div>
                            
                            <!-- 大阪天氣 -->
                            <div class="flex flex-col items-center justify-center p-3 bg-blue-50/50 rounded-xl border border-slate-100 relative">
                                <span class="text-[10px] font-bold text-slate-400 absolute top-2 left-2 uppercase tracking-wider">Osaka</span>
                                <div id="osaka-icon" class="text-4xl text-blue-400 mb-1 mt-2">
                                    <i class="ph ph-spinner animate-spin"></i>
                                </div>
                                <h4 class="text-sm font-black text-slate-700 mt-1">大阪府</h4>
                                <div class="flex items-end gap-1 mt-1">
                                    <span id="osaka-temp" class="text-2xl font-black text-slate-800 tracking-tighter">--</span>
                                    <span class="text-sm font-bold text-slate-500 mb-0.5">°C</span>
                                </div>
                            </div>
                        </div>

                        <!-- 每小時天氣趨勢 (自動定位) -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
                            <div class="flex items-center justify-between mb-3">
                                <h4 id="hourly-location-name" class="text-xs font-bold text-slate-600 flex items-center gap-1.5">
                                    <i class="ph-fill ph-map-pin text-red-500"></i> 定位中...
                                </h4>
                            </div>
                            <!-- 橫向滑動容器 -->
                            <div id="hourly-container" class="flex overflow-x-auto gap-2 pb-2 no-scrollbar scroll-smooth">
                                <!-- JS 動態載入每小時卡片 -->
                            </div>
                        </div>
                    </div>

                    <!-- 2. 行程導航 -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-800 mb-3 ml-1 flex items-center gap-1">
                            <i class="ph-fill ph-map-pin text-indigo-500 text-lg"></i> 專屬行程導航
                        </h3>
                        <div class="w-full bg-gradient-to-br from-blue-600 to-indigo-600 rounded-[2rem] p-8 shadow-sm text-white flex flex-col items-center justify-center relative overflow-hidden transition-transform hover:scale-[1.02] border border-white/20">
                            <i class="ph-fill ph-map-trifold absolute -right-8 -bottom-8 text-[12rem] opacity-10"></i>
                            <i class="ph-fill ph-navigation-arrow absolute top-6 right-8 text-4xl opacity-20"></i>
                            
                            <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center mb-6 shadow-inner relative z-10 border border-white/30">
                                <i class="ph-fill ph-google-logo text-4xl text-white"></i>
                            </div>
                            
                            <h2 class="text-2xl font-black tracking-wide mb-2 relative z-10 text-center">行程儲存地標</h2>
                            <p class="text-sm text-blue-100 text-center mb-8 relative z-10 font-medium px-4 leading-relaxed">
                                已為您整理好本次旅行的<br/>完整 Google Maps 清單
                            </p>
                            
                            <a href="https://maps.app.goo.gl/TNxogxAoDMAGPNM76" target="_blank" class="w-full py-4 bg-white hover:bg-blue-50 text-blue-700 text-base font-black rounded-2xl transition-all flex justify-center items-center gap-2 shadow-lg active:scale-95 relative z-10">
                                <i class="ph-bold ph-arrow-square-out text-xl"></i> 打開 Google Maps
                            </a>
                        </div>
                        <p class="text-[10px] text-slate-500 mt-4 flex items-center justify-center gap-1.5 font-medium">
                            <i class="ph-fill ph-info text-slate-400"></i> 點擊將直接喚醒手機內建的地圖 App
                        </p>
                    </div>

                </div>
            </div>

            <!-- Tab 4: 行前確認 -->
            <div id="tab-checklist" class="tab-content">
                <div class="p-4 space-y-6">
                    <h2 class="text-lg font-black text-slate-800 mb-2 flex items-center gap-2"><i class="ph-fill ph-check-square-offset text-red-600 text-xl"></i> 行前最終確認清單</h2>
                    <div id="checklist-container"></div>
                </div>
            </div>

            <!-- Tab 5: 行李清單 -->
            <div id="tab-luggage" class="tab-content">
                <div class="p-4 space-y-6">
                    <h2 class="text-lg font-black text-slate-800 mb-2 flex items-center gap-2"><i class="ph-fill ph-suitcase text-red-600 text-xl"></i> 行李打包清單</h2>
                    <div id="luggage-container"></div>
                </div>
            </div>

        </main>

        <!-- 底部 5 個導覽按鈕 -->
        <nav class="bg-white border-t border-slate-200 flex justify-around items-center pt-2 pb-4 absolute bottom-0 w-full h-[72px] shadow-[0_-10px_20px_rgba(0,0,0,0.03)] z-20">
            <button onclick="switchTab('itinerary')" id="nav-itinerary" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-red-600 active:scale-95">
                <i class="ph-fill ph-calendar-blank text-xl"></i>
                <span class="text-[10px] font-bold">行程</span>
            </button>
            <button onclick="switchTab('budget')" id="nav-budget" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-slate-400 active:scale-95">
                <i class="ph-fill ph-wallet text-xl"></i>
                <span class="text-[10px] font-bold">記帳</span>
            </button>
            <button onclick="switchTab('maps')" id="nav-maps" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-slate-400 active:scale-95">
                <i class="ph-fill ph-map-trifold text-xl"></i>
                <span class="text-[10px] font-bold">地圖</span>
            </button>
            <button onclick="switchTab('checklist')" id="nav-checklist" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-slate-400 active:scale-95">
                <i class="ph-fill ph-check-square text-xl"></i>
                <span class="text-[10px] font-bold">確認</span>
            </button>
            <button onclick="switchTab('luggage')" id="nav-luggage" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-slate-400 active:scale-95">
                <i class="ph-fill ph-suitcase text-xl"></i>
                <span class="text-[10px] font-bold">行李</span>
            </button>
        </nav>
    </div>

<script>
    // --- 核心資料區 ---
    const itineraryData = [
      {
        day: "Day 1", date: "8/25 (二)",
        events: [
          { time: "07:30-08:30", title: "台中出發 ➔ 桃園機場", transport: "樂高專車", desc: "司機至指定地點接駕，前往桃園機場 T1。", mapQuery: "Taoyuan+International+Airport+Terminal+1", voucherType: "transfer" },
          { time: "11:05-14:55", title: "國泰航空 CX564 (TPE ➔ KIX)", transport: "飛行 (約2.5小時)", desc: "準備起飛，展開京阪雙城之旅！", mapQuery: "Kansai+International+Airport", voucherType: "flight" },
          { time: "14:55-16:00", title: "抵達關西機場 (KIX) 通關", transport: "步行", desc: "盡速完成通關、領取 4 件大行李。", mapQuery: "Kansai+International+Airport" },
          { time: "16:14-17:30", title: "搭乘特急前往京都", transport: "JR Haruka", desc: "對號座，大型行李放置於車廂後方行李架。", mapQuery: "Kyoto+Station", voucherType: "haruka", routeStops: ["關西機場 (KIX)", "天王寺", "大阪", "新大阪", "京都 (Kyoto)"] },
          { time: "17:30-18:00", title: "京都車站 ➔ OMO3", transport: "步行散步", desc: "推行李散步至飯店辦理入住。", mapQuery: "OMO3+Kyoto+Toji", voucherType: "kyoto_hotel" },
          { time: "18:30-20:00", title: "晚餐：穂屋-MINORIYA-", transport: "步行", desc: "享用飯店周邊高評價的濃郁拉麵，安頓休息。", mapQuery: "Minoriya+Kyoto" }
        ]
      },
      {
        day: "Day 2", date: "8/26 (三)",
        events: [
          { time: "08:30-09:30", title: "飯店出發 ➔ 伏見稻荷", transport: "計程車", desc: "飯店吃完早餐出門。直接搭計程車前往伏見稻荷大社。", mapQuery: "Fushimi+Inari+Taisha" },

                    const textColor = isFirst || isLast ? 'text-slate-700 font-bold' : 'text-slate-500 font-medium';
                    const textSize = isFirst || isLast ? 'text-xs' : 'text-[11px]';
                    
                    let stopContent = '';
                    if (typeof stop === 'object' && stop.mapQuery) {
                        // 可點擊的門市導航
                        stopContent = `
                            <a href="https://www.google.com/maps/search/?api=1&query=${stop.mapQuery}" target="_blank" class="text-[11px] font-bold text-slate-700 pb-3 flex items-center gap-1.5 hover:text-pink-600 transition-colors active:scale-95 group">
                                ${stop.name} 
                                <span class="bg-blue-50 text-blue-500 p-1 rounded-full"><i class="ph-bold ph-navigation-arrow text-[10px]"></i></span>
                            </a>
                        `;
                    } else {
                        // 純文字車站
                        const stopName = typeof stop === 'object' ? stop.name : stop;
                        stopContent = `<div class="${textSize} ${textColor} pb-3">${stopName}</div>`;
                    }
                    
                    return `
                        <div class="flex items-start gap-3 relative z-10">
                            <div class="flex flex-col items-center mt-1">
                                <div class="w-2.5 h-2.5 rounded-full border-2 ${dotColor} z-10"></div>
                            </div>
                            ${stopContent}
                        </div>
                    `;
                }).join('');

                routeHtml = `
                    <div class="mt-2 pl-2 pr-2 border-t border-slate-50 pt-2.5 pb-1">
                        <button onclick="toggleRouteStops('${routeId}')" class="flex items-center gap-1.5 text-[11px] font-bold text-slate-500 hover:text-slate-800 transition-colors w-full text-left active:scale-[0.98]">
                            <i class="ph-bold ${routeIcon} ${routeIconColor} text-sm"></i>
                            <span>${routeLabel}</span>
                            <i id="icon-${routeId}" class="ph-bold ph-caret-down ml-auto transition-transform"></i>
                        </button>
                        <div id="${routeId}" class="hidden mt-3 pl-1 transition-all">
                            <div class="relative pl-1">
                                <div class="absolute left-[8px] top-2 bottom-6 w-[2px] bg-slate-200 z-0"></div>
                                ${stopsList}
                            </div>
                        </div>
                    </div>
                `;
            }

            // 判斷交通工具顏色與圖示
            let transportColor = 'bg-slate-100 text-slate-600'; 
            let transportIcon = 'ph-map-pin';
            const t = ev.transport;

            if (t.includes('飛行')) {
                transportColor = 'bg-sky-100 text-sky-700';
                transportIcon = 'ph-airplane-tilt';
            } else if (t.includes('地鐵') || t.includes('JR') || t.includes('電車') || t.includes('阪急')) {
                transportColor = 'bg-emerald-100 text-emerald-700';
                transportIcon = 'ph-train';
            } else if (t.includes('專車') || t.includes('拼車')) {
                transportColor = 'bg-indigo-100 text-indigo-700';
                transportIcon = 'ph-car-profile';
            } else if (t.includes('計程車') || t.includes('包車')) {
                transportColor = 'bg-amber-100 text-amber-700';
                transportIcon = 'ph-car';
            } else if (t.includes('步行') || t.includes('散步') || t.includes('順坡')) {
                transportColor = 'bg-stone-100 text-stone-600';
                transportIcon = 'ph-sneaker';
            } else if (t.includes('電梯') || t.includes('纜車') || t.includes('船') || t.includes('行程內建')) {
                transportColor = 'bg-purple-100 text-purple-700';
                transportIcon = 'ph-paper-plane-tilt';
            }

            return `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-red-500 rounded-l-2xl"></div>
                    <div class="flex justify-between items-start mb-2 pl-2">
                        <span class="bg-slate-100 text-slate-700 text-[11px] font-bold px-2.5 py-1 rounded-md flex items-center gap-1.5">
                            <i class="ph-bold ph-clock"></i> ${ev.time}
                        </span>
                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-md flex items-center gap-1.5 ${transportColor}">
                            <i class="ph-fill ${transportIcon} text-sm"></i> ${ev.transport}
                        </span>
                    </div>
                    <div class="flex items-center gap-2 pl-2 mt-2 pr-2">
                        <h3 class="text-base font-black text-slate-800 leading-tight flex items-center tracking-wide">${titleIcon}${ev.title}</h3>

                    <p class="text-xs text-slate-500 mt-2 pl-2 leading-relaxed font-medium">${ev.desc}</p>
                    ${routeHtml}
                    ${voucherBtn}
                </div>
            `;
        }).join('');
    }

    function toggleFixedGroup(group) {
        fixedBudgetExpanded[group] = !fixedBudgetExpanded[group];

    function renderFixedBudget() {
        const container = document.getElementById('fixed-budget-list');
        const paidItems = fixedBudgetData.filter(item => item.status === 'paid');
        const unpaidItems = fixedBudgetData.filter(item => item.status === 'unpaid');
        
        const totalPaid = paidItems.reduce((sum, item) => sum + item.total, 0);
        const totalUnpaid = unpaidItems.reduce((sum, item) => sum + item.total, 0);

        const renderGroup = (title, items, total, groupId, icon, colorClass, isExpanded) => {
            if(items.length === 0) return '';
            let groupHtml = `
            <div class="border-b border-slate-200 last:border-0 overflow-hidden">
                <div onclick="toggleFixedGroup('${groupId}')" class="flex items-center justify-between p-3.5 bg-slate-100/50 cursor-pointer hover:bg-slate-100 active:bg-slate-200 transition-colors">
                    <div class="flex items-center gap-2">
                        <i class="ph-fill ${icon} ${colorClass} text-lg"></i>
                        <span class="text-sm font-bold text-slate-700">${title}</span>
                        <span class="text-[10px] font-bold text-slate-400 bg-white px-1.5 py-0.5 rounded-md shadow-sm border border-slate-200">${items.length}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-black text-slate-800">NT$ ${total.toLocaleString()}</span>
                        <i class="ph-bold ph-caret-${isExpanded ? 'up' : 'down'} text-slate-400 transition-transform"></i>
                    </div>
                </div>
                <div class="${isExpanded ? 'block' : 'hidden'} bg-white">
            `;
            
            items.forEach(item => {
                groupHtml += `
                    <div class="flex items-center justify-between p-3.5 border-t border-slate-100 last:border-0 ml-2 mr-2">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 rounded-xl ${item.bg} ${item.color}"><i class="${item.icon} text-lg"></i></div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <p class="text-sm font-bold text-slate-800 leading-none">${item.title}</p>
                                    ${item.tag ? `<span class="text-[9px] px-1.5 py-0.5 rounded-md font-bold ${item.tagColor}">${item.tag}</span>` : ''}
                                </div>
                                <p class="text-[10px] text-slate-500 font-medium">${item.desc}</p>
                            </div>
                        </div>
                        <p class="text-sm font-black text-slate-800">${item.total.toLocaleString()}</p>
                    </div>
                `;
            });
            
            groupHtml += `</div></div>`;
            return groupHtml;
        };

        container.innerHTML = 
            renderGroup('待付款項目', unpaidItems, totalUnpaid, 'unpaid', 'ph-clock-circle', 'text-amber-500', fixedBudgetExpanded.unpaid) +
            renderGroup('已付清項目', paidItems, totalPaid, 'paid', 'ph-check-circle', 'text-emerald-500', fixedBudgetExpanded.paid);
    }

    function renderDynamicExpenses() {
        const container = document.getElementById('dynamic-expense-list');
        if(dynamicExpenses.length === 0) {
            container.innerHTML = '<div class="p-5 text-center text-slate-400 text-xs font-medium">目前尚無新增花費。</div>';
        } else {
            container.innerHTML = dynamicExpenses.map(exp => `
                <div class="flex items-center justify-between p-3.5 border-b border-slate-100 last:border-0">
                    <p class="text-sm font-bold text-slate-700">${exp.name}</p>
                    <div class="flex items-center gap-3">
                        <p class="text-sm font-black text-slate-800">${exp.amount.toLocaleString()}</p>
                        <button onclick="removeExpense(${exp.id})" class="text-slate-300 hover:text-red-500 active:scale-95 transition-transform"><i class="ph-bold ph-trash text-lg"></i></button>
                    </div>
                </div>
            `).join('');
        }
        updateTotals();
    }

    function updateTotals() {
        const totalFixed = fixedBudgetData.reduce((sum, item) => sum + item.total, 0);
        const totalDynamic = dynamicExpenses.reduce((sum, exp) => sum + exp.amount, 0);
        const grandTotal = totalFixed + totalDynamic;
        
        document.getElementById('fixed-subtotal-display').innerText = `小計：NT$ ${totalFixed.toLocaleString()}`;
        document.getElementById('dynamic-subtotal-display').innerText = `動態小計：NT$ ${totalDynamic.toLocaleString()}`;
        document.getElementById('grand-total-display').innerText = `NT$ ${grandTotal.toLocaleString()}`;
        document.getElementById('per-person-display').innerText = `NT$ ${Math.round(grandTotal/4).toLocaleString()}`;
    }

    document.getElementById('rate-input').addEventListener('input', (e) => {
        currentExchangeRate = parseFloat(e.target.value) || 0;
        const jpy = document.getElementById('jpy-input').value;
        if(jpy) document.getElementById('expense-amount').value = Math.round(jpy * currentExchangeRate);
    });

    document.getElementById('jpy-input').addEventListener('input', (e) => {
        const val = e.target.value;
        if(val) document.getElementById('expense-amount').value = Math.round(val * currentExchangeRate);
        else document.getElementById('expense-amount').value = '';
    });

    document.getElementById('expense-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('expense-name').value;
        const amount = document.getElementById('expense-amount').value;
        if(name && amount) {
            dynamicExpenses.push({ id: Date.now(), name: name, amount: parseInt(amount, 10) });
            document.getElementById('expense-name').value = '';
            document.getElementById('expense-amount').value = '';
            document.getElementById('jpy-input').value = '';
            renderDynamicExpenses();
        }
    });

    function removeExpense(id) {
        dynamicExpenses = dynamicExpenses.filter(exp => exp.id !== id);
        renderDynamicExpenses();
    }

    function closeVoucher() {

    // --- 極簡天氣 API 抓取邏輯 ---
    const getWeatherIcon = (code) => {
        if (code <= 3) return '<i class="ph-fill ph-sun text-amber-500"></i>'; // 晴朗/多雲
        if (code >= 45 && code <= 48) return '<i class="ph-fill ph-cloud-fog text-slate-400"></i>'; // 霧
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return '<i class="ph-fill ph-cloud-rain text-blue-500"></i>'; // 陣雨
        if (code >= 71 && code <= 77) return '<i class="ph-fill ph-snowflake text-sky-300"></i>'; // 雪
        if (code >= 95) return '<i class="ph-fill ph-cloud-lightning text-indigo-500"></i>'; // 雷雨
        return '<i class="ph-fill ph-cloud text-slate-400"></i>';
    };

    async function fetchWeather() {
        const kyotoTemp = document.getElementById('kyoto-temp');
        const osakaTemp = document.getElementById('osaka-temp');
        const kyotoIcon = document.getElementById('kyoto-icon');
        const osakaIcon = document.getElementById('osaka-icon');
        
        kyotoTemp.innerText = '--'; osakaTemp.innerText = '--';
        kyotoIcon.innerHTML = '<i class="ph ph-spinner animate-spin"></i>';
        osakaIcon.innerHTML = '<i class="ph ph-spinner animate-spin"></i>';

        try {
            const kyotoRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.01&longitude=135.76&current_weather=true');
            const kyotoData = await kyotoRes.json();
            kyotoTemp.innerText = Math.round(kyotoData.current_weather.temperature);
            kyotoIcon.innerHTML = getWeatherIcon(kyotoData.current_weather.weathercode);
            
            const osakaRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.69&longitude=135.50&current_weather=true');
            const osakaData = await osakaRes.json();
            osakaTemp.innerText = Math.round(osakaData.current_weather.temperature);
            osakaIcon.innerHTML = getWeatherIcon(osakaData.current_weather.weathercode);
        } catch (error) {
            kyotoTemp.innerText = 'Err'; osakaTemp.innerText = 'Err';
            kyotoIcon.innerHTML = '<i class="ph-fill ph-warning-circle text-red-400"></i>';
        }

        // 同時啟動定位與每小時天氣抓取
        requestCurrentLocationHourly();
    }

    function requestCurrentLocationHourly() {
        const container = document.getElementById('hourly-container');
        container.innerHTML = '<div class="w-full text-center py-6 text-xs text-slate-400 font-bold"><i class="ph ph-spinner animate-spin text-lg mb-1 block"></i> 正在定位...</div>';
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => fetchHourlyWeather(pos.coords.latitude, pos.coords.longitude, '📍 您目前的位置 (未來 24H)'),
                (err) => fetchHourlyWeather(35.01, 135.76, '📍 京都 (定位失敗/未授權)'), // Fallback
                { timeout: 5000 }
            );
        } else {
            fetchHourlyWeather(35.01, 135.76, '📍 京都 (裝置不支援)');
        }
    }

    async function fetchHourlyWeather(lat, lon, locName) {
        document.getElementById('hourly-location-name').innerHTML = `<i class="ph-fill ph-map-pin text-red-500"></i> ${locName}`;
        const container = document.getElementById('hourly-container');
        
        try {
            // 使用 unixtime 確保時區正確對齊
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weathercode&timeformat=unixtime&timezone=auto&forecast_days=2`);
            const data = await res.json();
            
            const currentEpoch = Math.floor(Date.now() / 1000);
            // 找出最接近「現在時間」的索引 (往前扣一小時確保涵蓋當下)
            let startIndex = data.hourly.time.findIndex(t => t > currentEpoch - 3600);
            if (startIndex === -1) startIndex = 0;
            
            let html = '';
            // 渲染未來 24 小時
            for(let i = startIndex; i < startIndex + 24; i++) {
                if(i >= data.hourly.time.length) break;
                const timeSec = data.hourly.time[i];
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const code = data.hourly.weathercode[i];
                
                const date = new Date(timeSec * 1000);
                const hourStr = date.getHours().toString().padStart(2, '0') + ':00';
                const iconStr = getWeatherIcon(code);
                
                // 第一個時間(現在)加上特別底色
                const isNow = i === startIndex;
                const bgClass = isNow ? 'bg-red-50 border-red-100' : 'bg-slate-50 border-slate-100';
                const timeColor = isNow ? 'text-red-500' : 'text-slate-400';
                
                html += `
                    <div class="flex flex-col items-center justify-center min-w-[60px] ${bgClass} border rounded-xl py-2 shrink-0 shadow-sm">
                        <span class="text-[10px] ${timeColor} font-bold mb-1 tracking-wider">${isNow ? '現在' : hourStr}</span>
                        <div class="text-2xl mb-1">${iconStr}</div>
                        <span class="text-sm font-black text-slate-700">${temp}°</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        } catch (e) {
            container.innerHTML = '<div class="w-full text-center py-4 text-xs text-red-400 font-bold">預報載入失敗</div>';
        }
    }
