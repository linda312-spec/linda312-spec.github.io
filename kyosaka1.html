<body class="bg-slate-900 flex justify-center h-screen overflow-hidden">

<div class="w-full h-full max-w-md bg-slate-50 flex flex-col relative shadow-2xl overflow-hidden">

    <!-- 憑證彈窗 Modal -->
    <div id="voucher-modal" class="fixed inset-0 z-[60] items-center justify-center p-4 bg-slate-900/70">
        <button onclick="closeVoucher()" class="absolute top-6 right-6 p-2 bg-white/20 hover:bg-white/30 rounded-full text-white backdrop-blur-md transition-colors z-50">
            <i class="ph ph-x text-xl"></i>
        </button>
        <div id="voucher-content" class="w-full max-w-sm"></div>
    </div>

    <!-- PWA 安裝提示 (會在點擊後消失) -->
    <div id="pwa-install-tip" class="absolute top-20 left-4 right-4 bg-slate-800 text-white text-xs p-3 rounded-xl shadow-2xl z-50 flex items-center justify-between cursor-pointer animate-pulse" onclick="this.style.display='none'">
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-export text-xl text-indigo-400"></i>
            <span>點擊瀏覽器分享 ➔ <b>「加入主畫面」</b>，即可當作 App 離線使用！</span>
        </div>
        <i class="ph ph-x"></i>
    </div>

    <!-- 頂部 Header -->
    <header class="relative px-5 pt-12 pb-6 shadow-md z-10 overflow-hidden bg-red-600 shrink-0">
        <svg class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none" style="background-color: #dc2626" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="daruma-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                <path d="M40 15 C 60 15, 65 35, 65 55 C 65 75, 50 75, 40 75 C 30 75, 15 75, 15 55 C 15 35, 20 15, 40 15 Z" fill="#fff" stroke="#450a0a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <ellipse cx="40" cy="45" rx="16" ry="14" fill="#ffe4e6" stroke="#450a0a" stroke-width="1.5"/>
                <circle cx="34" cy="43" r="2.5" fill="#450a0a"/>
                <circle cx="46" cy="43" r="2.5" fill="#450a0a"/>
                <path d="M29 38 Q 34 35 37 39 M43 39 Q 46 35 51 38" stroke="#450a0a" fill="none" stroke-width="2" stroke-linecap="round"/>
                <path d="M35 52 Q 40 55 45 52" stroke="#450a0a" fill="none" stroke-width="2" stroke-linecap="round"/>
                <path d="M30 62 Q 40 70 50 62" stroke="#450a0a" fill="none" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M35 66 L 45 66" stroke="#450a0a" fill="none" stroke-width="1.5" stroke-linecap="round"/>
              </pattern>
            </defs>
            <rect x="0" y="0" width="100%" height="100%" fill="url(#daruma-pattern)" />
        </svg>
        <div class="relative z-10">
            <h1 class="text-2xl font-black text-white tracking-wide drop-shadow-md">京阪雙城深度旅遊記</h1>
            <p class="text-sm text-red-100 mt-1 drop-shadow-sm font-medium">關西 6天5夜 黃金動線與預算</p>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto overflow-x-hidden pb-24 relative bg-slate-50">

        <!-- Tab 1: 每日行程 -->
        <div id="tab-itinerary" class="tab-content active">
            <div id="day-selector" class="flex overflow-x-auto gap-3 px-5 py-4 no-scrollbar bg-slate-50 sticky top-0 z-10 shadow-sm border-b border-slate-100">
                <!-- 由 JS 動態生成 -->
            </div>
            <div id="itinerary-list" class="p-5 space-y-4">
                <!-- 由 JS 動態生成 -->
            </div>
        </div>

        <!-- Tab 2: 預算記帳 -->
        <div id="tab-budget" class="tab-content">
            <div class="p-5 space-y-6">
                <!-- 總花費卡片 -->
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                    <div class="absolute -right-2 -top-2 opacity-10"><i class="ph-fill ph-calculator text-9xl"></i></div>
                    <p class="text-slate-300 text-sm font-medium mb-1">總花費累計 (4人)</p>
                    <h2 class="text-4xl font-black tracking-tight" id="grand-total-display">NT$ 0</h2>
                    <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between items-center">
                        <span class="text-slate-300 text-xs">單人平均</span>
                        <span class="text-xl font-bold text-emerald-400" id="per-person-display">NT$ 0</span>
                    </div>
                </div>

                <!-- 固定支出清單 -->
                <div>
                    <h3 class="text-sm font-bold text-slate-800 mb-3 ml-1 flex items-center gap-1"><i class="ph-fill ph-lock-key text-slate-400"></i> 已知固定支出 (點擊可收折)</h3>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div id="fixed-budget-list"></div>
                        <div class="p-3 bg-slate-50 text-right border-t border-slate-100">
                            <span class="text-xs text-slate-500 font-bold" id="fixed-subtotal-display">小計：NT$ 0</span>
                        </div>
                    </div>
                </div>

                <!-- 動態記帳區 -->
                <div>
                    <h3 class="text-sm font-bold text-slate-800 mb-3 ml-1 flex items-center gap-1">
                        <i class="ph-fill ph-coins text-amber-500"></i> 即時匯率與旅途記帳
                    </h3>
                    
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-4">
                        <div class="flex items-center gap-2 mb-3 border-b border-slate-100 pb-3">
                            <div class="flex-1">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">日幣 (JPY)</label>
                                <div class="flex items-center gap-1 mt-1">
                                    <span class="text-slate-400 font-bold text-lg">¥</span>
                                    <input type="number" id="jpy-input" class="w-full bg-slate-50 text-base font-bold text-slate-800 rounded-lg px-2 py-2 border border-slate-200 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors" placeholder="輸入金額">
                                </div>
                            </div>
                            <i class="ph-bold ph-arrows-left-right text-slate-300 mt-5"></i>
                            <div class="w-20 shrink-0">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">匯率</label>
                                <input type="number" id="rate-input" step="0.001" value="0.21" class="w-full bg-slate-50 text-base font-bold text-slate-800 rounded-lg px-2 py-2 border border-slate-200 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors mt-1 text-center">
                            </div>
                        </div>

                        <form id="expense-form" class="flex gap-2 items-end">
                            <div class="flex-1">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">消費項目</label>
                                <input type="text" id="expense-name" placeholder="如: 晚餐/藥妝" required class="w-full bg-slate-50 text-sm font-medium rounded-lg px-3 py-2.5 border border-slate-200 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors mt-1">
                            </div>
                            <div class="w-24 shrink-0">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">台幣 (TWD)</label>
                                <input type="number" id="expense-amount" placeholder="自動換算" required class="w-full bg-red-50 text-sm font-bold text-red-600 rounded-lg px-3 py-2.5 border border-red-200 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors mt-1">
                            </div>
                            <button type="submit" class="bg-red-600 text-white p-3 rounded-lg hover:bg-red-700 active:scale-95 transition-all shrink-0">
                                <i class="ph-bold ph-plus text-lg"></i>
                            </button>
                        </form>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden min-h-[100px]">
                        <div id="dynamic-expense-list"></div>
                        <div class="p-3 bg-red-50 text-right border-t border-red-100">
                            <span class="text-xs text-red-600 font-black tracking-wide" id="dynamic-subtotal-display">動態小計：NT$ 0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 3: 行前確認 -->
        <div id="tab-checklist" class="tab-content">
            <div class="p-5 space-y-6">
                <h2 class="text-lg font-black text-slate-800 mb-2 flex items-center gap-2">
                    <i class="ph-fill ph-check-square-offset text-red-600 text-xl"></i> 行前最終確認清單
                </h2>
                <div id="checklist-container"></div>
            </div>
        </div>

        <!-- Tab 4: 行李清單 -->
        <div id="tab-luggage" class="tab-content">
            <div class="p-5 space-y-6">
                <h2 class="text-lg font-black text-slate-800 mb-2 flex items-center gap-2">
                    <i class="ph-fill ph-suitcase text-red-600 text-xl"></i> 行李打包清單
                </h2>
                <div id="luggage-container"></div>
            </div>
        </div>

        <!-- Tab 5: 專屬地圖 (新增) -->
        <div id="tab-maps" class="tab-content">
            <div class="p-5 space-y-6 h-full flex flex-col items-center justify-center mt-20">
                <div class="bg-blue-50 p-6 rounded-full mb-4 shadow-inner">
                    <i class="ph-fill ph-map-trifold text-6xl text-blue-500"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800 tracking-wide">專屬儲存地標</h2>
                <p class="text-sm text-slate-500 text-center px-4 leading-relaxed font-medium mt-2">
                    已為您整理好本次京阪旅行的所有儲存地點。<br>點擊下方按鈕將直接開啟 Google Maps App，導航不迷路！
                </p>
                <a href="https://maps.app.goo.gl/TNxogxAoDMAGPNM76" target="_blank" class="mt-8 w-full max-w-[280px] py-4 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-base font-black rounded-2xl transition-all flex justify-center items-center gap-2 shadow-xl shadow-blue-600/30">
                    <i class="ph-bold ph-arrow-square-out text-xl"></i> 打開 Google Maps
                </a>
            </div>
        </div>

    </main>

    <!-- 底部 5 個導覽按鈕 -->
    <nav class="bg-white border-t border-slate-200 flex justify-around items-center pb-safe pt-2 absolute bottom-0 w-full h-16 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] z-20">
        <button onclick="switchTab('itinerary')" id="nav-itinerary" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-red-600 active:scale-95">
            <i class="ph-fill ph-calendar-blank text-2xl"></i>
            <span class="text-[10px] font-bold">行程</span>
        </button>
        <button onclick="switchTab('budget')" id="nav-budget" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-slate-400 active:scale-95">
            <i class="ph-fill ph-wallet text-2xl"></i>
            <span class="text-[10px] font-bold">記帳</span>
        </button>
        <button onclick="switchTab('maps')" id="nav-maps" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-slate-400 active:scale-95">
            <i class="ph-fill ph-map-trifold text-2xl"></i>
            <span class="text-[10px] font-bold">地圖</span>
        </button>
        <button onclick="switchTab('checklist')" id="nav-checklist" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-slate-400 active:scale-95">
            <i class="ph-fill ph-check-square text-2xl"></i>
            <span class="text-[10px] font-bold">確認</span>
        </button>
        <button onclick="switchTab('luggage')" id="nav-luggage" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors text-slate-400 active:scale-95">
            <i class="ph-fill ph-suitcase text-2xl"></i>
            <span class="text-[10px] font-bold">行李</span>
        </button>
    </nav>
</div>

<script>
    // --- 資料區 ---
    const itineraryData = [
      {
        day: "Day 1", date: "8/25 (二)",
        events: [
          { time: "07:30-08:30", title: "台中出發 ➔ 桃園機場", transport: "樂高專車", desc: "司機至指定地點接駕，前往桃園機場 T1。", mapQuery: "Taoyuan+International+Airport+Terminal+1", voucherType: "transfer" },
          { time: "11:05-14:55", title: "國泰航空 CX564 (TPE ➔ KIX)", transport: "飛行 (約2.5小時)", desc: "準備起飛，展開京阪雙城之旅！", mapQuery: "Kansai+International+Airport", voucherType: "flight" },
          { time: "14:55-16:00", title: "抵達關西機場 (KIX) 通關", transport: "步行", desc: "盡速完成通關、領取 4 件大行李。", mapQuery: "Kansai+International+Airport" },
          { time: "16:14-17:30", title: "搭乘特急前往京都", transport: "JR Haruka (約76分)", desc: "對號座，大型行李放置於車廂後方行李架。", mapQuery: "Kyoto+Station", voucherType: "haruka" },
          { time: "17:30-18:00", title: "京都車站 ➔ OMO3", transport: "步行 (約15分)", desc: "推行李散步至飯店辦理入住。", mapQuery: "OMO3+Kyoto+Toji", voucherType: "kyoto_hotel" },
          { time: "18:30-20:00", title: "晚餐：穂屋-MINORIYA-", transport: "步行 (約5分)", desc: "享用飯店周邊高評價的濃郁拉麵，安頓休息。", mapQuery: "Minoriya+Kyoto" }
        ]
      },
      {

          { time: "08:30-09:30", title: "飯店出發 ➔ 伏見稻荷", transport: "計程車 (15分)", desc: "飯店吃完早餐出門。直接搭計程車前往伏見稻荷大社。", mapQuery: "Fushimi+Inari+Taisha" },

          { time: "11:00-11:20", title: "伏見稻荷 ➔ 清水寺", transport: "計程車 (20分)", desc: "直接要求司機開到清水寺門口，省去爬坡體力。", mapQuery: "Kiyomizu-dera" },
      { time: "11:20-12:30", title: "清水寺參拜", transport: "步行散策", desc: "門票¥500。抽籤、買御守，拍攝仁王門、清水舞台、三重塔、音羽瀑布。", mapQuery: "Kiyomizu-dera" },
      { time: "12:30-13:30", title: "午餐：清水順正 おかべ家", transport: "順坡步行", desc: "於清水寺周邊享用名物湯豆腐/湯葉鍋。", mapQuery: "Kiyomizu+Junsei+Okabeya" },

      {

                    </button>

                transportColor = 'bg-sky-100 text-sky-700'; // 飛機 (淺藍)

                transportIcon = 'ph-car';

                transportColor = 'bg-stone-100 text-stone-600'; // 步行 (石頭灰)

        const totalUnpaid = unpaidItems.reduce((sum, item) => sum + item.total, 0);

            if(items.length === 0) return '';
            let groupHtml = `
            <div class="border-b border-slate-100 last:border-0 overflow-hidden">

                        <span class="text-[10px] font-bold text-slate-400 bg-white px-1.5 py-0.5 rounded-md border border-slate-200 shadow-sm">${items.length}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-black text-slate-800">NT$ ${total.toLocaleString()}</span>
                        <i class="ph-bold ph-caret-${isExpanded ? 'up' : 'down'} text-slate-400 transition-transform"></i>
                    </div>
                </div>
                <div class="${isExpanded ? 'block' : 'hidden'} bg-white">
            `;
            
            items.forEach(item => {
                groupHtml += `
                    <div class="flex items-center justify-between p-3.5 border-t border-slate-50 last:border-0 ml-2 mr-2">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 rounded-xl ${item.bg} ${item.color}"><i class="${item.icon} text-lg"></i></div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <p class="text-sm font-bold text-slate-800 leading-none">${item.title}</p>

                                </div>
                                <p class="text-[10px] text-slate-400 font-medium">${item.desc}</p>
                            </div>
                        </div>
                        <p class="text-sm font-black text-slate-800">${item.total.toLocaleString()}</p>
                    </div>
                `;
            });
            
            groupHtml += `</div></div>`;
            return groupHtml;
        };

        container.innerHTML = 
            renderGroup('待付款項目', unpaidItems, totalUnpaid, 'unpaid', 'ph-clock-circle', 'text-amber-500', fixedBudgetExpanded.unpaid) +
            renderGroup('已付清項目', paidItems, totalPaid, 'paid', 'ph-check-circle', 'text-emerald-500', fixedBudgetExpanded.paid);
    }

                        <button onclick="removeExpense(${exp.id})" class="text-slate-300 hover:text-red-500 active:scale-95 transition-transform"><i class="ph-bold ph-trash text-lg"></i></button>
                    </div>
                </div>
            `).join('');
        }
        updateTotals();
    }

    function updateTotals() {
        const totalFixed = fixedBudgetData.reduce((sum, item) => sum + item.total, 0);
        const totalDynamic = dynamicExpenses.reduce((sum, exp) => sum + exp.amount, 0);
        const grandTotal = totalFixed + totalDynamic;
        
        document.getElementById('fixed-subtotal-display').innerText = `小計：NT$ ${totalFixed.toLocaleString()}`;
        document.getElementById('dynamic-subtotal-display').innerText = `動態小計：NT$ ${totalDynamic.toLocaleString()}`;
        document.getElementById('grand-total-display').innerText = `NT$ ${grandTotal.toLocaleString()}`;
        document.getElementById('per-person-display').innerText = `NT$ ${Math.round(grandTotal/4).toLocaleString()}`;
    }

    // 表單事件監聽 (匯率連動)
    document.getElementById('rate-input').addEventListener('input', (e) => {
        currentExchangeRate = parseFloat(e.target.value) || 0;
        const jpy = document.getElementById('jpy-input').value;
        if(jpy) document.getElementById('expense-amount').value = Math.round(jpy * currentExchangeRate);
    });

    document.getElementById('jpy-input').addEventListener('input', (e) => {
        const val = e.target.value;
        if(val) document.getElementById('expense-amount').value = Math.round(val * currentExchangeRate);
        else document.getElementById('expense-amount').value = '';
    });

    document.getElementById('expense-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('expense-name').value;
        const amount = document.getElementById('expense-amount').value;
        if(name && amount) {
            dynamicExpenses.push({ id: Date.now(), name: name, amount: parseInt(amount, 10) });
            document.getElementById('expense-name').value = '';
            document.getElementById('expense-amount').value = '';
            document.getElementById('jpy-input').value = '';
            renderDynamicExpenses();
        }
    });

    function removeExpense(id) {
        dynamicExpenses = dynamicExpenses.filter(exp => exp.id !== id);
        renderDynamicExpenses();
    }

        const container = document.getElementById(containerId);
        container.innerHTML = dataArray.map((group, cIdx) => `

                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-2 mb-5">
                    ${group.items.map((item, iIdx) => `
                        <div onclick="${toggleFuncStr}(${cIdx}, ${iIdx})" class="flex items-center gap-3 p-3 cursor-pointer hover:bg-slate-50 rounded-xl transition active:scale-[0.98]">

        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

            el.classList.add('text-slate-400');
            el.querySelector('i').classList.remove('fill-red-50', 'fill-indigo-50');
        });
        
        document.getElementById(`tab-${tabId}`).classList.add('active');
        const activeBtn = document.getElementById(`nav-${tabId}`);
        const colorClass = 'text-red-600';

        activeBtn.classList.remove('text-slate-400');
